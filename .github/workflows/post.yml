name: daily-deal-post
on:
  schedule:
    - cron: "0 16 * * *"   # 16:00 UTC daily (~19:00 Israel)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - run: pip install -r requirements.txt
      - name: Render card, commit image so it has a public URL
        run: |
          python main.py --dry-run
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add out && git commit -m "card" || true
          git push || true
      - name: Post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/out
        run: python main.py
      - name: Save posted list
        run: |
          git add posted.json && git commit -m "posted" || true
          git push || true
